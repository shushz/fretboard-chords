  <body>
    <div id="app"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 2rem auto; padding: 0 16px; font-family: sans-serif">
        <h1>Fretboard Chords</h1>
        <p>
          Fretboard Chords is a free practice app for guitarists. It helps you learn where every
          chord of a key lives on the guitar neck, which note of the chord each string plays (root,
          third, fifth, seventh), and how the chords of a key connect, in all 24 keys.
        </p>
        <h2>Practice modes</h2>
        <ul>
          <li>
            <b>Find the chord</b>: tap a chord of the key (e.g. the iv of F♯ minor) on a chosen
            group of strings and frets.
          </li>
          <li><b>From the tonic</b>: from the I or i chord, find the IV, V, vi… nearby.</li>
          <li>
            <b>Next / previous shape</b>: find the next shape of the same chord up or down the neck.
          </li>
          <li>
            <b>Name the tones</b>: label each note of a shape as R, ♭3, 3, 5, ♭7… or tap a given
            role.
          </li>
          <li><b>Quality switch</b>: turn a major chord minor (and more) by moving one note.</li>
          <li>
            <b>Progression walk</b>: play real progressions chord by chord, staying close to the
            last shape.
          </li>
          <li><b>Name the chord</b>: chord names and Roman numerals in every key.</li>
        </ul>
        <p>
          Triads and seventh chords, correct spelling in every key, spaced repetition and progress
          charts. It works offline, can be installed on your phone, and needs no account: your
          progress stays on your device. Open source (MIT).
        </p>
        <p><b>This app needs JavaScript.</b> Please enable it in your browser to use it.</p>
      </main>
    </noscript>
