name: PR preview

# Builds every pull request and publishes it to
#   https://shushz.github.io/fretboard-chords/pr-preview/pr-<number>/
# with its own storage and demo data, then comments the link on the PR. The preview is
# removed when the PR is closed or merged.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /fretboard-chords/pr-preview/pr-${{ github.event.number }}/
          PREVIEW_PR: ${{ github.event.number }}
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
